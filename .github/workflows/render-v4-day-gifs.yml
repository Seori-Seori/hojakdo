name: Render V4 day GIFs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-v4-day-gifs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy scipy

      - name: Run regression tests
        run: python -m unittest discover -s prototype -p 'test_*.py'

      - name: Render four 6-hour day-review GIFs
        run: python -m prototype.hojakdo_v4.render_day_gifs

      - name: Combine a single 24-hour preview GIF
        run: |
          cd prototype/hojakdo_v4/output
          ffmpeg -hide_banner -loglevel error -y \
            -i hojakdo_v4_day_00_06.gif \
            -i hojakdo_v4_day_06_12.gif \
            -i hojakdo_v4_day_12_18.gif \
            -i hojakdo_v4_day_18_24.gif \
            -filter_complex "[0:v][1:v][2:v][3:v]concat=n=4:v=1:a=0,split[a][b];[a]palettegen=max_colors=192:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle[v]" \
            -map "[v]" -loop 0 hojakdo_v431_24h_preview.gif

      - name: Show generated artifacts
        run: ls -lh prototype/hojakdo_v4/output/hojakdo_v4_day_*.gif prototype/hojakdo_v4/output/hojakdo_v431_24h_preview.gif prototype/hojakdo_v4/output/hojakdo_v4_day_review_manifest.json

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/hojakdo_v4/output/hojakdo_v4_day_*.gif
          git add prototype/hojakdo_v4/output/hojakdo_v431_24h_preview.gif
          git add prototype/hojakdo_v4/output/hojakdo_v4_day_review_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "artifacts: add V4.3.1 day review GIFs [skip ci]"
          git push origin HEAD:main
