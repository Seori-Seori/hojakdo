name: Validate and render Hojakdo V4.3.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-v4-day-gifs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy scipy

      - name: Run regression tests
        run: python -m unittest discover -s prototype -p 'test_*.py'

      - name: Assemble resource-only watch face
        run: ./gradlew :watchface:assembleDebug --stacktrace

      - name: Render four 6-hour day-review GIFs
        run: python -m prototype.hojakdo_v4.render_day_gifs

      - name: Combine 24-hour previews
        run: |
          cd prototype/hojakdo_v4/output
          ffmpeg -hide_banner -loglevel error -y \
            -i hojakdo_v4_day_00_06.gif \
            -i hojakdo_v4_day_06_12.gif \
            -i hojakdo_v4_day_12_18.gif \
            -i hojakdo_v4_day_18_24.gif \
            -filter_complex "[0:v][1:v][2:v][3:v]concat=n=4:v=1:a=0,split[a][b];[a]palettegen=max_colors=192:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle[v]" \
            -map "[v]" -loop 0 hojakdo_v432_24h_preview.gif
          ffmpeg -hide_banner -loglevel error -y \
            -i hojakdo_v432_24h_preview.gif \
            -filter_complex "[0:v]setpts=PTS/4,fps=20,split[a][b];[a]palettegen=max_colors=160:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle[v]" \
            -map "[v]" -loop 0 hojakdo_v432_24h_preview_fast.gif

      - name: Verify cleaned generated tree
        run: |
          test ! -e assets/layers/v4/drawable/hojakdo_v4_readout_hanji_patch.png
          test ! -e assets/layers/v4/drawable/plum_foreground_mask.png
          test ! -e assets/layers/v4/drawable/pine_foreground_mask.png
          grep -q 'name="tiger_visual_slot"' watchface/src/main/res/raw/watchface.xml
          ! grep -q 'readout_hanji_patch' watchface/src/main/res/raw/watchface.xml
          ! grep -q 'plum_foreground_mask' watchface/src/main/res/raw/watchface.xml
          ! grep -q 'pine_foreground_mask' watchface/src/main/res/raw/watchface.xml

      - name: Show generated artifacts
        run: |
          ls -lh prototype/hojakdo_v4/output/hojakdo_v4_day_*.gif
          ls -lh prototype/hojakdo_v4/output/hojakdo_v432_24h_preview*.gif
          ls -lh prototype/hojakdo_v4/output/hojakdo_v4_day_review_manifest.json

      - name: Commit generated assets and review artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/layers/v4
          git add watchface/src/main/res/raw/watchface.xml
          git add prototype/hojakdo_v4/output/hojakdo_v4_integrated_static.png
          git add prototype/hojakdo_v4/output/hojakdo_v4_readout_cleanup_review.png
          git add prototype/hojakdo_v4/output/hojakdo_v4_emulator_regression_review.png
          git add prototype/hojakdo_v4/output/hojakdo_v4_review_board.png
          git add prototype/hojakdo_v4/output/hojakdo_v4_animation_catalog.png
          git add prototype/hojakdo_v4/output/hojakdo_v4_day_*.gif
          git add prototype/hojakdo_v4/output/hojakdo_v432_24h_preview*.gif
          git add prototype/hojakdo_v4/output/hojakdo_v4_day_review_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "artifacts: refresh V4.3.2 layer-cleanup review [skip ci]"
          git push origin HEAD:main
